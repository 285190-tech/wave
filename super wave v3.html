<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050609">
<meta name="description" content="Wave is your space to chat, hang out, and build with friends.">
<title>Wave — your space, your people</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --fs-xs:11px;--fs-sm:12.5px;--fs-md:13.5px;--fs-base:14.5px;--fs-lg:16px;--fs-xl:20px;
  --r-xs:6px;--r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:22px;--r-full:999px;
  --dur:180ms;--ease:cubic-bezier(.2,.8,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="midnight"]{--bg-0:#050609;--bg-1:#0a0c13;--bg-2:#0f1119;--bg-3:#141720;--bg-4:#1c2030;--bg-5:#252a3d;--glass:rgba(20,23,32,.72);--border:rgba(255,255,255,.06);--border-2:rgba(255,255,255,.1);--text:#f2f4fa;--text-2:#b4bccc;--text-3:#767d92;--text-4:#4a5068;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--gold:#eab308}
[data-theme="daylight"]{--bg-0:#f5f7fb;--bg-1:#fff;--bg-2:#f9fafc;--bg-3:#eef1f6;--bg-4:#e2e6ee;--bg-5:#d3d9e3;--glass:rgba(255,255,255,.88);--border:rgba(0,0,0,.07);--border-2:rgba(0,0,0,.12);--text:#12141c;--text-2:#4a5060;--text-3:#7c8296;--text-4:#a8aebe;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--gold:#ca8a04}
[data-theme="slate"]{--bg-0:#0b1016;--bg-1:#101720;--bg-2:#151d28;--bg-3:#1b2531;--bg-4:#243040;--bg-5:#2e3d51;--glass:rgba(21,29,40,.78);--border:rgba(120,150,190,.1);--border-2:rgba(120,150,190,.18);--text:#dce6f2;--text-2:#a3b2c7;--text-3:#6f7f95;--text-4:#485466;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;--gold:#facc15}
[data-theme="amoled"]{--bg-0:#000;--bg-1:#000;--bg-2:#050505;--bg-3:#0a0a0a;--bg-4:#121212;--bg-5:#1c1c1c;--glass:rgba(8,8,8,.85);--border:rgba(255,255,255,.06);--border-2:rgba(255,255,255,.1);--text:#f5f5f5;--text-2:#b0b0b0;--text-3:#757575;--text-4:#454545;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--gold:#eab308}
[data-theme="forest"]{--bg-0:#080f0c;--bg-1:#0d1713;--bg-2:#121d18;--bg-3:#18251e;--bg-4:#203026;--bg-5:#2b3f33;--glass:rgba(18,29,24,.78);--border:rgba(120,200,150,.1);--border-2:rgba(120,200,150,.18);--text:#e4f2e8;--text-2:#b0c8b8;--text-3:#7a927f;--text-4:#4d6154;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;--gold:#eab308}
[data-theme="rose"]{--bg-0:#130a10;--bg-1:#1a0f18;--bg-2:#211420;--bg-3:#2a1a29;--bg-4:#352234;--bg-5:#432c42;--glass:rgba(33,20,32,.78);--border:rgba(240,140,180,.1);--border-2:rgba(240,140,180,.18);--text:#f7e6ef;--text-2:#cbb0c0;--text-3:#91748a;--text-4:#5e4757;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;--gold:#facc15}
:root{--accent:#8b5cf6;--accent-2:#a78bfa;--accent-soft:rgba(139,92,246,.14);--grad:linear-gradient(135deg,#8b5cf6,#ec4899);--grad-soft:linear-gradient(135deg,rgba(139,92,246,.18),rgba(236,72,153,.1))}
[data-admin="1"]{--accent:#eab308;--accent-2:#facc15;--accent-soft:rgba(234,179,8,.14);--grad:linear-gradient(135deg,#eab308,#f97316);--grad-soft:linear-gradient(135deg,rgba(234,179,8,.18),rgba(249,115,22,.1))}
body{font-family:var(--font);font-size:var(--fs-base);background:var(--bg-0);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 70% 50% at 12% -10%,var(--accent-soft),transparent 65%)}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;user-select:none}
a{color:var(--accent-2);text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--accent-soft);color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:72px 260px 1fr 220px;position:relative;z-index:1;overflow:hidden}
@media(max-width:1200px){#app{grid-template-columns:72px 240px 1fr}.members{display:none}}
@media(max-width:900px){#app{grid-template-columns:60px 1fr}.sidebar{position:fixed;left:60px;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-110%);transition:transform var(--dur) var(--ease);box-shadow:0 24px 80px rgba(0,0,0,.65);background:var(--bg-2)}.sidebar.open{transform:none}}
@media(max-width:600px){#app{grid-template-columns:0 1fr}.rail{display:none}.sidebar{left:0}}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;overflow-y:auto;background:var(--bg-1);border-right:1px solid var(--border)}
.rail::-webkit-scrollbar{width:0}
[data-admin="1"] .rail{padding-top:40px}
[data-admin="1"] .rail::before{content:'ADMIN';position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;letter-spacing:.16em;color:#eab308;background:rgba(234,179,8,.14);padding:3px 8px;border-radius:6px;border:1px solid rgba(234,179,8,.4)}
.rail-btn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;font-size:20px;color:var(--text-2);position:relative;background:var(--bg-3);border:1px solid var(--border);transition:all var(--dur) var(--spring)}
.rail-btn:hover{background:var(--bg-4);color:var(--text);border-radius:14px;transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.rail-btn.active{background:var(--grad);color:#fff;border-radius:14px;border:none;box-shadow:0 10px 32px -10px var(--accent)}
.rail-btn.active::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:4px;height:32px;border-radius:0 4px 4px 0;background:#fff}
.rail-btn .badge{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2.5px solid var(--bg-0)}
.rail-sep{width:26px;height:1px;background:var(--border-2);flex-shrink:0;margin:6px 0}
.sidebar{background:var(--bg-1);display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0;min-height:0}
.side-head{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);flex-shrink:0;font-weight:700;font-size:var(--fs-base);cursor:pointer;transition:background var(--dur)}
.side-head:hover{background:var(--bg-2)}
.side-scroll{flex:1;overflow-y:auto;padding:8px 8px 20px;min-height:0}
.side-section{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);font-weight:800;padding:14px 8px 6px;display:flex;align-items:center;gap:6px}
.side-section button{margin-left:auto;font-size:16px;color:var(--text-3);width:22px;height:22px;display:grid;place-items:center;border-radius:6px}
.side-section button:hover{color:var(--text);background:var(--bg-3)}
.chan{display:flex;align-items:center;gap:9px;padding:7px 10px;margin:1px 0;border-radius:var(--r-sm);color:var(--text-3);font-weight:500;font-size:var(--fs-md);cursor:pointer;transition:all var(--dur);position:relative}
.chan:hover{background:var(--bg-3);color:var(--text-2)}
.chan.active{background:var(--grad-soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent-soft)}
.chan .ic{width:20px;text-align:center;font-size:15px;opacity:.75;flex-shrink:0}
.chan .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chan .cnt{background:var(--danger);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:grid;place-items:center}
.voice-user{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 32px;font-size:12.5px;color:var(--text-3)}
.voice-user .led{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.conn-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg-2);border-top:1px solid var(--border);font-size:var(--fs-xs);color:var(--text-3);flex-shrink:0}
.conn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.conn-dot.online{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.conn-dot.connecting{background:var(--warn)}
.conn-dot.offline{background:var(--text-4)}
.conn-dot.error{background:var(--danger)}
.me-bar{height:64px;background:var(--bg-2);display:flex;align-items:center;gap:4px;padding:0 10px;border-top:1px solid var(--border);flex-shrink:0}
.me-id{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:6px 8px;border-radius:var(--r-md);cursor:pointer}
.me-id:hover{background:var(--bg-3)}
.me-id .info{min-width:0;flex:1;text-align:left}
.me-id .nm{font-size:var(--fs-md);font-weight:700;line-height:1.25;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-id .st{font-size:var(--fs-xs);color:var(--text-3);line-height:1.25}
.coin-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#eab308,#f97316);color:#000;font-size:10.5px;font-weight:900;padding:3px 9px;border-radius:var(--r-full)}
.premium-badge{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000;font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:.05em}
.av{border-radius:50%;display:grid;place-items:center;overflow:hidden;flex-shrink:0;position:relative;background:var(--bg-4);user-select:none;font-weight:600;box-shadow:inset 0 0 0 1px var(--border)}
.av img{width:100%;height:100%;object-fit:cover}
.av .status{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--bg-1)}
.status.online{background:var(--ok)}
.status.idle{background:var(--warn)}
.status.dnd{background:var(--danger)}
.status.offline{background:var(--text-4)}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-3);font-size:16px;transition:all var(--dur);flex-shrink:0}
.icon-btn:hover{background:var(--bg-3);color:var(--text)}
.btn{padding:9px 16px;border-radius:var(--r-sm);font-size:var(--fs-md);font-weight:700;background:var(--bg-4);color:var(--text);border:1px solid var(--border-2);transition:all var(--dur);cursor:pointer}
.btn:hover{background:var(--bg-5);transform:translateY(-1px)}
.btn.primary{background:var(--grad);color:#fff;border:none;box-shadow:0 6px 16px -6px var(--accent)}
.btn.danger{background:var(--danger);color:#fff;border:none}
.btn.ghost{background:transparent;border:1px solid var(--border-2)}
.btn.ghost:hover{background:var(--bg-3)}
.btn.gold{background:linear-gradient(135deg,#eab308,#f97316);color:#000;border:none;font-weight:900}
.chat{background:var(--bg-2);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
#main-view{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;min-width:0;position:relative}
[data-admin="1"] .chat::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#eab308,#f97316,#eab308,transparent);opacity:.75;z-index:20;pointer-events:none}
.chat-head{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border);z-index:10;flex-shrink:0}
.chat-head h1{font-size:var(--fs-lg);font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .hash{font-size:20px;color:var(--text-3);font-weight:600}
.chat-head .grow{flex:1}
.messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 0;min-height:0;scrollbar-gutter:stable}
.jump-latest{position:absolute;right:22px;bottom:83px;z-index:20;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;background:var(--bg-4);border:1px solid var(--border-2);box-shadow:0 8px 26px rgba(0,0,0,.35);color:var(--text);font-size:12px;font-weight:750;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px);transition:opacity var(--dur),transform var(--dur),visibility var(--dur)}
.jump-latest.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.jump-latest:hover{background:var(--bg-5);border-color:var(--accent-2)}
.messages-inner{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:10px}
.day-div{display:flex;align-items:center;gap:14px;margin:24px 0 12px;color:var(--text-3);font-size:var(--fs-xs);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.day-div::before,.day-div::after{content:'';flex:1;height:1px;background:var(--border-2)}
.sys-msg{padding:6px 0 6px 52px;color:var(--text-3);font-size:var(--fs-md);font-style:italic}
.msg{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:4px 10px;border-radius:var(--r-md);position:relative;min-width:0}
.msg:hover{background:var(--bg-3)}
.msg.pending{opacity:.68}
.msg.pending .msg-actions{display:none!important}
.msg.grouped{padding-top:1px;padding-bottom:1px}
.msg.grouped .msg-av{visibility:hidden;height:0}
.msg.mention{background:linear-gradient(90deg,var(--accent-soft),transparent 75%);box-shadow:inset 3px 0 0 var(--accent)}
.msg-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--bg-4);cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-body{min-width:0;overflow:hidden}
.msg-head{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.msg-name{font-weight:800;font-size:var(--fs-base);cursor:pointer}
.msg-time{font-size:var(--fs-xs);color:var(--text-3);font-variant-numeric:tabular-nums}
.msg-tag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;line-height:1}
.msg-tag.you{background:var(--accent-soft);color:var(--accent-2)}
.msg-tag.admin{background:linear-gradient(135deg,#eab308,#f97316);color:#000}
.msg-tag.mod{background:linear-gradient(135deg,#4cc9f0,#3b82f6);color:#fff}
.msg-tag.prem{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000}
.msg-content{color:var(--text);font-size:var(--fs-base);line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;max-width:100%}
.msg-content b{font-weight:700}
.msg-content i{font-style:italic}
.msg-content code{background:var(--bg-3);border:1px solid var(--border-2);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:.88em;color:#f0a5d4;word-break:break-word}
.msg-content .spoiler{background:var(--bg-4);color:transparent;border-radius:4px;padding:1px 5px;cursor:pointer;user-select:none}
.msg-content .spoiler.revealed{background:var(--bg-3);color:var(--text)}
.msg-content .mention-chip{background:var(--accent-soft);color:var(--accent-2);padding:1px 6px;border-radius:4px;font-weight:700;cursor:pointer}
.msg-content .mention-chip.self{background:var(--accent);color:#fff}
.msg-content .msg-link{color:var(--accent-2);text-decoration:underline}
.msg-content pre,.code-block{position:relative;background:#0a0c11;border:1px solid var(--border-2);border-radius:10px;margin:8px 0;max-width:100%;overflow:hidden;font-family:var(--mono)}
.msg-content pre code.hljs,.code-block code{display:block;padding:12px 14px;background:none;border:none;font-size:12.5px;line-height:1.65;overflow-x:auto;white-space:pre;max-width:100%;color:#e6e6e6}
.cb-head{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border-2);font-size:11px}
.cb-lang{font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.cb-actions{margin-left:auto;display:flex;gap:4px}
.cb-btn{font-size:10.5px;font-weight:700;color:var(--text-3);padding:3px 8px;border-radius:5px;background:var(--bg-4);border:1px solid var(--border-2);cursor:pointer;transition:all var(--dur)}
.cb-btn:hover{color:var(--text);background:var(--bg-5)}
.cb-btn.ok{color:var(--ok)}
.reply-ctx{display:flex;align-items:center;gap:6px;padding:3px 0 5px;font-size:var(--fs-sm);color:var(--text-3);cursor:pointer;max-width:100%}
.reply-ctx::before{content:'';width:24px;height:10px;flex-shrink:0;border-left:2px solid var(--border-2);border-top:2px solid var(--border-2);border-top-left-radius:8px;transform:translateY(4px)}
.reply-ctx .who{font-weight:700;color:var(--text-2)}
.reply-ctx .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.msg-attach-img{max-width:min(400px,100%);max-height:340px;border-radius:12px;margin-top:6px;cursor:zoom-in;border:1px solid var(--border-2);object-fit:contain}
.reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.react{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-full);background:var(--bg-3);border:1px solid var(--border-2);font-size:13px;cursor:pointer;transition:all var(--dur)}
.react:hover{border-color:var(--accent-2);background:var(--bg-4)}
.react.mine{background:var(--accent-soft);border-color:var(--accent-2)}
.react .cnt{font-size:var(--fs-xs);font-weight:800;color:var(--text-3)}
.react.mine .cnt{color:var(--accent-2)}

async function compressImage(file,maxDim=900,quality=.75){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height;if(w>maxDim||h>maxDim){const s=Math.min(maxDim/w,maxDim/h);w=Math.round(w*s);h=Math.round(h*s);}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/jpeg',quality));};i.onerror=()=>res(r.result);i.src=r.result;};r.readAsDataURL(file);});}
async function compressAvatar(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const size=128;const c=document.createElement('canvas');c.width=size;c.height=size;const x=c.getContext('2d');const s=Math.min(i.width,i.height);const sx=(i.width-s)/2,sy=(i.height-s)/2;x.drawImage(i,sx,sy,s,s,0,0,size,size);res(c.toDataURL('image/jpeg',.82));};i.onerror=()=>res(null);i.src=r.result;};r.readAsDataURL(file);});}

function playSound(kind){if(!P.sounds)return;try{audioCtx||=new(window.AudioContext||window.webkitAudioContext)();const freqs=kind==='msg'?[880]:[660,880];freqs.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;const t0=audioCtx.currentTime+i*.08;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.05,t0+.02);g.gain.linearRampToValueAtTime(0,t0+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+.2);});}catch{}}
async function computeFingerprint(){try{const parts=[];parts.push(navigator.language||'');parts.push(navigator.languages?.join(',')||'');parts.push(String(screen.width)+'x'+String(screen.height));parts.push(String(screen.colorDepth));parts.push(String(new Date().getTimezoneOffset()));parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone||'');parts.push(String(navigator.hardwareConcurrency||''));parts.push(String(navigator.deviceMemory||''));parts.push(navigator.platform||'');parts.push(String(navigator.maxTouchPoints||0));try{const c=document.createElement('canvas');c.width=200;c.height=40;const x=c.getContext('2d');x.textBaseline='top';x.font='14px Arial';x.fillStyle='#f60';x.fillRect(0,0,100,20);x.fillStyle='#069';x.fillText('WaveFP-'+navigator.userAgent.slice(0,40),2,15);x.fillStyle='rgba(102,204,0,0.7)';x.fillText('WaveFP',4,20);parts.push(c.toDataURL().slice(-64));}catch{}try{const gl=document.createElement('canvas').getContext('webgl');if(gl){parts.push(gl.getParameter(gl.VENDOR)||'');parts.push(gl.getParameter(gl.RENDERER)||'');}}catch{}const str=parts.join('|');const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).slice(0,8).map(b=>b.toString(16).padStart(2,'0')).join('');}catch{return 'fp_'+Math.random().toString(36).slice(2,10);}}
async function recordIdentity(){try{const fp=await computeFingerprint();localStorage.setItem('wave.fp',fp);const ua=navigator.userAgent.slice(0,200);await supabase.from('client_identities').upsert({user_id:Tab.userId,fingerprint:fp,user_agent:ua,last_seen:new Date().toISOString()},{onConflict:'user_id,fingerprint'});}catch(e){console.warn('identity record failed',e);}}
async function loadIdentityLog(){if(!canAdmin())return;const{data}=await supabase.from('client_identities').select('*').order('last_seen',{ascending:false}).limit(300);identityLog=data||[];}
function findAlts(){const byFp=new Map();for(const row of identityLog){if(!byFp.has(row.fingerprint))byFp.set(row.fingerprint,new Set());byFp.get(row.fingerprint).add(row.user_id);}const alts=[];for(const[fp,users]of byFp){if(users.size>1)alts.push({fp,users:Array.from(users)});}return alts;}

const PeerSession={peer:null,peerId:null,room:null,roomType:null,localStream:null,connections:new Map(),muted:false,camOff:false,screenStream:null,startTs:0,timer:null,overlay:null};
function peerIdFor(userId,suffix='0'){return'wave-'+userId.replace(/-/g,'').slice(0,20)+'-'+suffix;}
function initPeer(){if(PeerSession.peer)return PeerSession.peer;if(typeof Peer==='undefined')return null;try{PeerSession.peer=new Peer(peerIdFor(Tab.userId,'0'),{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});PeerSession.peer.on('open',id=>{PeerSession.peerId=id;});PeerSession.peer.on('error',e=>{if(e.type==='unavailable-id'){const suffix=String(Math.floor(Math.random()*99)+1);PeerSession.peer=new Peer(peerIdFor(Tab.userId,suffix),{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});PeerSession.peer.on('open',id=>{PeerSession.peerId=id;});PeerSession.peer.on('call',inc=>handleIncomingCall(inc));}});PeerSession.peer.on('call',inc=>handleIncomingCall(inc));return PeerSession.peer;}catch{return null;}}

function reconcileMessage(channelId,tempId,row){
  const message=Network.rowToMsg(row);const list=S.messages[channelId]||=[];
  const canonicalIndex=list.findIndex(item=>item.id===message.id);
  const temporaryIndex=list.findIndex(item=>item.id===tempId);
  if(canonicalIndex>=0){list[canonicalIndex]=message;if(temporaryIndex>=0&&temporaryIndex!==canonicalIndex)list.splice(temporaryIndex,1);}
  else if(temporaryIndex>=0)list[temporaryIndex]=message;
  else list.push(message);
  return message;
}

function openQuickSwitcher(){
  const existing=$('#quick-switcher');
  if(existing){document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));return;}
  if($('#layers .overlay'))return;
  const previous=document.activeElement;
  const overlay=el('div',{class:'overlay',id:'quick-switcher',role:'presentation'});
  const dialog=el('section',{class:'quick-switcher',role:'dialog','aria-modal':'true','aria-label':'Quick switcher'});
  const searchRow=el('div',{class:'qs-search'});
  searchRow.appendChild(el('span',{class:'qs-icon','aria-hidden':'true'},'⌕'));
  const input=el('input',{id:'qs-input',type:'search',placeholder:'Jump to a channel, DM, or feature…','aria-label':'Search channels, direct messages, and features',autocomplete:'off',spellcheck:'false'});
  searchRow.appendChild(input);searchRow.appendChild(el('kbd',{},'ESC'));
  const results=el('div',{class:'qs-results',role:'listbox','aria-label':'Navigation results'});
  const hints=el('div',{class:'qs-hint'});
  hints.append(el('span',{},'↑ ↓ navigate'),el('span',{},'↵ open'),el('span',{},'ESC close'));
  dialog.append(searchRow,results,hints);overlay.appendChild(dialog);$('#layers').appendChild(overlay);
  const items=[
    {label:'Home',detail:'Your Wave home',icon:'⌂',view:'home'},
    {label:'AI Assistant',detail:'Chat with Atlas',icon:'🤖',view:'ai'},
    {label:'Code Editor',detail:'Edit and preview files',icon:'💻',view:'code'},
    {label:'Games',detail:'Play a game',icon:'🎮',view:'games'},
    {label:'Shop',detail:'Coins and cosmetics',icon:'💰',view:'coins'},
    {label:'Peek',detail:'Community activity',icon:'🕵️',view:'peek'},
    ...Object.values(S.channels).map(ch=>({
      label:ch.type==='dm'?chLabel(ch):`${ch.type==='voice'?'🔊 ':'#'}${ch.name}`,
      detail:ch.type==='dm'?'Direct message':(Servers.list.find(server=>server.id===ch.serverId)?.name||'Channel'),
      icon:ch.type==='dm'?'💬':ch.type==='voice'?'🔊':'#',channelId:ch.id
    }))
  ];
  if(canMod())items.push({label:canAdmin()?'Admin dashboard':'Moderator tools',detail:'Manage Wave',icon:canAdmin()?'👑':'🔨',view:'admin'});
  let shown=items,active=0;
  const close=()=>{overlay.remove();document.removeEventListener('keydown',onKey);if(previous?.isConnected)previous.focus();};
  const choose=item=>{
    if(!item)return;
    if(item.channelId){Tab.view='channel';Tab.activeChannel=item.channelId;clearUnread(item.channelId);}
    else Tab.view=item.view;
    $('#sidebar')?.classList.remove('open');
    close();invalidate('rail','sidebar','main','members');
  };
  const render=()=>{
    const q=input.value.trim().toLocaleLowerCase();
    shown=items.filter(item=>`${item.label} ${item.detail}`.toLocaleLowerCase().includes(q));
    active=Math.min(active,Math.max(0,shown.length-1));results.innerHTML='';
    if(!shown.length){results.appendChild(el('div',{class:'qs-empty'},'No matching channels or views.'));return;}
    shown.forEach((item,index)=>{
      const row=el('button',{class:'qs-row',type:'button',role:'option','aria-selected':index===active?'true':'false'});
      row.appendChild(el('span',{class:'qs-row-icon','aria-hidden':'true'},item.icon));
      const copy=el('span',{class:'qs-row-copy'});copy.appendChild(el('div',{class:'qs-label'},item.label));copy.appendChild(el('div',{class:'qs-detail'},item.detail));row.appendChild(copy);
      row.addEventListener('mouseenter',()=>{active=index;updateActive();});
      row.addEventListener('click',()=>choose(item));results.appendChild(row);
    });
    updateActive();
  };
  const updateActive=()=>{results.querySelectorAll('.qs-row').forEach((row,index)=>row.setAttribute('aria-selected',index===active?'true':'false'));results.querySelector('.qs-row[aria-selected="true"]')?.scrollIntoView({block:'nearest'});};
  const onKey=e=>{
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();return;}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      if(!shown.length)return;e.preventDefault();active=(active+(e.key==='ArrowDown'?1:-1)+shown.length)%shown.length;updateActive();
    }else if(e.key==='Enter'){e.preventDefault();choose(shown[active]);}
  };
  input.addEventListener('input',()=>{active=0;render();});
  overlay.addEventListener('mousedown',e=>{if(e.target===overlay)close();});
  document.addEventListener('keydown',onKey);render();input.focus();
}

async function renderCodeEditor(root){
  if(!window.CodeMirror){root.appendChild(el('div',{class:'empty-home'},el('div',{class:'big'},'💻'),el('div',{class:'ttl'},'CodeMirror failed to load')));return;}
  if(codeEditorInstance && codeEditorInstance.container.isConnected)return;
  if(codeEditorInstance){
    root.innerHTML='';
    root.appendChild(codeEditorInstance.container);
    const members=$('#members');
    if(members){
      members.innerHTML='';
      members.classList.add('code-files-host');
      members.appendChild(codeEditorInstance.filesPane);
    }
    return;
  }
  if(codeEditorLoading)return;
  codeEditorLoading=true;
  try{
    const instance=await initCodeEditor();
    if(!instance)return;
    codeEditorInstance=instance;
    if(Tab.view!=='code')return;
    root.innerHTML='';
    root.appendChild(instance.container);
    const members=$('#members');
    if(members){
      members.innerHTML='';
      members.classList.add('code-files-host');
      members.appendChild(instance.filesPane);
    }
  }finally{
    codeEditorLoading=false;
  }
}

function renderMD(text){

  let s=esc(text);

  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  s=s.replace(/~~([^~\n]+)~~/g,'<s>$1</s>');

  s=s.replace(/(https?:\/\/[^\s<]+)/g,'<a class="msg-link" href="$1" target="_blank" rel="noopener">$1</a>');

  return s;
}

async function sendMsg(){
  const ta=$('#comp-input');if(!ta)return;
  const draft=ta.value,text=draft.trim();if(!text)return;
  const shouldRestoreFocus=document.activeElement===ta;
  const ch=activeCh();if(!ch||pendingMessages.has(ch.id))return;
  const tempId=rid('t_');
  const msg={id:tempId,channelId:ch.id,authorId:Tab.userId,text,reactions:{},replyTo:replyDrafts.get(ch.id)||null,ts:now(),pending:true};
  pendingMessages.add(ch.id);channelDrafts.delete(ch.id);replyDrafts.delete(ch.id);persistDrafts();(S.messages[ch.id]||=[]).push(msg);
  ta.value='';invalidate('main');renderComposer();

  const list=S.messages[ch.id]||[];const index=list.findIndex(item=>item.id===tempId);const confirmedIndex=list.findIndex(item=>item._optimisticId===tempId);
  if(row){reconcileMessage(ch.id,tempId,row);channelDrafts.delete(ch.id);}
  else if(confirmedIndex>-1){delete list[confirmedIndex]._optimisticId;channelDrafts.delete(ch.id);}
  else{

  invalidate('main');
}

async function handleFile(file){

  const tempId=rid('t_');
  const msg={id:tempId,channelId:ch.id,authorId:Tab.userId,text:'',image:data,reactions:{},ts:now(),pending:true};
  (S.messages[ch.id]||=[]).push(msg);invalidate('main');
  const row=await Network.send(msg);
  if(row){reconcileMessage(ch.id,tempId,row);invalidate('main');}
  else{const list=S.messages[ch.id]||[];const i=list.findIndex(x=>x.id===tempId);const confirmed=list.findIndex(x=>x._optimisticId===tempId);if(confirmed>-1)delete list[confirmed]._optimisticId;else if(i>-1)list.splice(i,1);invalidate('main');if(confirmed<0)toast('❌ Upload failed');}
}
